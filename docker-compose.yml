version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: supermart_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: supermarket_db
      MYSQL_USER: supermart
      MYSQL_PASSWORD: supermart123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supermart_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: supermarket_db
      DB_USER: supermart
      DB_PASSWORD: supermart123
      JWT_SECRET: change_this_super_secret_key_in_production
      JWT_EXPIRES_IN: 24h
      ADMIN_EMAIL: admin@supermarket.com
      ADMIN_PASSWORD: admin123
      NODE_ENV: production
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supermart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
