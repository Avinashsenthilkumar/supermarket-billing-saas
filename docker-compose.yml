services:
  mysql:
    image: mysql:8.0
    container_name: supermart_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supermart_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      # root is used because the app creates one database per business
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: supermart_master
      TENANT_DB_PREFIX: sm_shop_
      JWT_SECRET: change_this_super_secret_key_in_production
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: admin@supermarket.com
      ADMIN_PASSWORD: admin123
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supermart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
